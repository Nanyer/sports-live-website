
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sports Live</title>
  <style>
    body {
      margin: 0;
      background: #10131b;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #202838;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    button {
      padding: 12px 18px;
      margin: 5px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    video {
      width: 100%;
      background: black;
      aspect-ratio: 16 / 9;
    }
    .note { color: #bdc6d5; }
  </style>
</head>
<body>
  <header>
    <h1>🏆 Sports Live</h1>
    <p>Watch authorized live sports</p>
  </header>

  <main>
    <h2>Select a sport</h2>
    <button onclick="showInfo('NBA')">🏀 NBA</button>
    <button onclick="showInfo('Boxing')">🥊 Boxing</button>
    <button onclick="showInfo('Other Sports')">⚽ Other Sports</button>

    <h2 id="event">Choose a sports event</h2>

    <video controls playsinline>
      Your browser does not support video playback.
    </video>

    <p class="note" id="status">
      The live stream will appear here when configured.
    </p>
  </main>

  <script>
    function showInfo(sport) {
      document.getElementById("event").textContent = sport;
      document.getElementById("status").textContent =
        "The " + sport +
        " player needs an authorized stream URL or official embed.";
    }
  </script>
</body>
</html>
