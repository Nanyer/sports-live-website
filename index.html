<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sports Live</title>
  <style>
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 16px;
    }
    .player {
      background: #263449;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .events {
      display: grid;
      grid-template-columns: repeat(auto-fit,
        minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .event {
      background: #1e293b;
      padding: 18px;
      border-radius: 10px;
    }
    a {
      color: #fca5a5;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏆 SPORTS LIVE</h1>
    <p>Boxing • NBA • Live Events</p>
  </header>

  <main>
    <h2>🥊 Boxing Live</h2>

    <div class="player">
      <!-- Replace this placeholder with the
           provider's authorized embed code. -->
      <div>
        <h3>Live Player</h3>
        <p>Official stream will appear here.</p>
      </div>
    </div>

    <div class="events">
      <div class="event">
        <h3>🥊 Boxing</h3>
        <p>Watch authorized boxing streams.</p>
      </div>
      <div class="event">
        <h3>🏀 NBA</h3>
        <p>View official basketball options.</p>
        <a href="https://www.nba.com/watch"
           target="_blank" rel="noopener">
          NBA Watch
        </a>
      </div>
    </div>
  </main>

  <footer>
    Sports Live | Authorized streams only
  </footer>
</body>
</html>
